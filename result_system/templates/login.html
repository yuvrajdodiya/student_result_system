{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            min-height:100vh;
            background:linear-gradient(135deg,#dff6ff,#ffffff,#f4f8ff);
        }

        .login-wrapper{
            min-height:100vh;
        }

        .login-card{
            width:100%;
            max-width:430px;
            border:none;
            border-radius:25px;
            overflow:hidden;
            background:#fff;
            box-shadow:0 15px 40px rgba(0,0,0,0.12);
        }

        .login-header{
            background:linear-gradient(135deg,#00b09b,#009688);
            text-align:center;
            color:white;
            padding:30px 20px;
        }

        .logo{
            width:95px;
            height:95px;
            border-radius:50%;
            background:white;
            padding:8px;
            object-fit:contain;
            margin-bottom:15px;
        }

        .login-header h2{
            font-size:30px;
            font-weight:700;
        }

        .login-header p{
            margin-top:5px;
            opacity:0.9;
        }

        .login-body{
            padding:30px;
        }

        .form-label{
            font-weight:600;
            margin-bottom:8px;
        }

        .form-control{
            border-radius:14px;
            padding:12px;
            border:1px solid #d8e2ef;
        }

        .form-control:focus{
            box-shadow:none;
            border-color:#009688;
        }

        .btn-login{
            width:100%;
            border:none;
            padding:12px;
            border-radius:14px;
            background:linear-gradient(135deg,#00b09b,#009688);
            color:white;
            font-weight:600;
            font-size:17px;
            margin-top:10px;
            transition:0.3s;
        }

        .btn-login:hover{
            transform:translateY(-2px);
            background:linear-gradient(135deg,#009688,#00796b);
        }

        .msg{
            background:#fff3f3;
            color:#c62828;
            border:1px solid #ffcdd2;
            padding:10px;
            border-radius:10px;
            margin-bottom:15px;
        }

        .footer-text{
            text-align:center;
            margin-top:20px;
            color:#777;
            font-size:14px;
        }

    </style>
</head>
<body>

<div class="container login-wrapper d-flex justify-content-center align-items-center px-3">

    <div class="login-card">

        <div class="login-header">
            <img src="{% static 'assist/shool_logo.png' %}" class="logo">

            <h2>Student Login</h2>
            <p>Login using Email & Phone Number</p>
        </div>

        <div class="login-body">

            {% if messages %}
                {% for message in messages %}
                    <div class="msg">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="post">

                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Student Email</label>

                    <input type="email"
                           name="email"
                           class="form-control"
                           placeholder="Enter Email ID"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone Number</label>

                    <input type="text"
                           name="phone"
                           class="form-control"
                           placeholder="Enter Phone Number"
                           required>
                </div>

                <button type="submit" class="btn-login">
                    Login
                </button>

            </form>

            <div class="footer-text">
                Student Result Management System
            </div>

        </div>

    </div>

</div>

</body>
</html>
