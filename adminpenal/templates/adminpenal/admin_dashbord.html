<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Result System - Sidebar</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root{
      --primary:#2563eb;
      --primary-dark:#1d4ed8;
      --bg:#eef4ff;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --radius:24px;
      --shadow:0 18px 45px rgba(37,99,235,.15);
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:"Poppins",sans-serif;
    }

    body{
      min-height:100vh;
      background:
        radial-gradient(circle at top left, rgba(37,99,235,.08), transparent 25%),
        radial-gradient(circle at bottom right, rgba(59,130,246,.08), transparent 20%),
        var(--bg);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      color:var(--text);
    }

    .sidebar{
      width:360px;
      background:linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
      color:#fff;
      border-radius:32px;
      padding:28px 22px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .brand{
      text-align:center;
      padding:10px 10px 22px;
      border-bottom:1px solid rgba(255,255,255,.15);
      margin-bottom:18px;
    }

    .logo-wrap{
      width:96px;
      height:96px;
      border-radius:50%;
      background:#fff;
      margin:0 auto 14px;
      display:grid;
      place-items:center;
      box-shadow:0 10px 25px rgba(0,0,0,.18);
      overflow:hidden;
    }

    .logo-wrap img{
      width:64px;
      height:64px;
      object-fit:contain;
    }

    .brand h2{
      font-size:20px;
      font-weight:700;
      line-height:1.2;
    }

    .brand p{
      font-size:12px;
      opacity:.88;
      margin-top:6px;
    }

    .teacher-id-box{
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.16);
      border-radius:18px;
      padding:16px;
      margin-bottom:18px;
      text-align:center;
      backdrop-filter:blur(10px);
    }

    .teacher-id-box .label{
      font-size:12px;
      opacity:.85;
      margin-bottom:6px;
    }

    .teacher-id-box .id{
      font-size:18px;
      font-weight:700;
      letter-spacing:.4px;
    }

    .teacher-id-box .name{
      font-size:13px;
      opacity:.9;
      margin-top:4px;
    }

    .menu-title{
      font-size:12px;
      letter-spacing:.12em;
      text-transform:uppercase;
      opacity:.8;
      margin:18px 10px 10px;
    }

    .menu a{
      display:flex;
      align-items:center;
      gap:14px;
      text-decoration:none;
      color:#fff;
      padding:14px 16px;
      margin:10px 6px;
      border-radius:16px;
      transition:all .25s ease;
      font-weight:500;
      border:1px solid transparent;
    }

    .menu a i{
      width:22px;
      text-align:center;
      font-size:16px;
    }

    .menu a:hover{
      background:rgba(255,255,255,.14);
      transform:translateX(8px);
      border-color:rgba(255,255,255,.16);
      box-shadow:0 10px 20px rgba(0,0,0,.08);
    }

    .menu a.active{
      background:#fff;
      color:var(--primary-dark);
      box-shadow:0 14px 25px rgba(0,0,0,.12);
    }

    .footer-note{
      margin-top:18px;
      text-align:center;
      font-size:12px;
      opacity:.85;
      padding-top:14px;
      border-top:1px solid rgba(255,255,255,.15);
    }

    @media (max-width: 480px){
      .sidebar{
        width:100%;
        padding:22px 16px;
      }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="brand">
      <div class="logo-wrap">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png" alt="School Logo">
      </div>
      <h2>School Result System</h2>
      <p>Admin Panel</p>
    </div>

    <div class="teacher-id-box">
      <div class="label">Teacher Login ID</div>
      <div class="id">TCH12042026</div>
      <div class="name">Mr. Rajesh Kumar</div>
    </div>

    <div class="menu-title">Main Menu</div>
    <nav class="menu">
      <a href="{% url 'add_student' %}" class="active">
        <i class="fa-solid fa-user-plus"></i> Add Student
      </a>

      <a href="{% url 'students' %}">
        <i class="fa-solid fa-users"></i> Students
      </a>

      <a href="{% url 'results' %}">
        <i class="fa-solid fa-square-poll-vertical"></i> Results
      </a>

       <a href="{% url 'info' %}">
        <i class="fa-circle-info"></i> Info
      </a>

      <a href="{% url 'logout' %}">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </a>
    </nav>

    <div class="footer-note">
      Student Result Management System
    </div>
  </aside>

</body>
</html>
